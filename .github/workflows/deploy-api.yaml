name: Build and Deploy API to Azure

# Controls when the action will occur
on:
  push:
    branches:
      - main

# Workflow of the pipeline
jobs:
  build-and-deploy:
    name: Build and Deploy API to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        id: github
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Configura Azure ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: SHA of the commit
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "::set-output name=short_sha::$calculatedSha"

      - name: Build and Push Docker image to ACR
        env:
          ACR_REGISTRY: ${{ vars.ACR_SERVER }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker build -f FormulaOne.Dockerfile -t $ACR_REGISTRY/formula-one-app:$IMAGE_TAG   -t $ACR_REGISTRY/formula-one-app:latest .
          docker push $ACR_REGISTRY/formula-one-app --all-tags