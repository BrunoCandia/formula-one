name: Build and Deploy API to Azure

# Controls when the action will occur
on:
  push:
    branches:
      - main

# Workflow of the pipeline
jobs:
  build-and-deploy:
    name: Build and Deploy API to Azure
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        id: github
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Configura Azure ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: SHA of the commit
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "::set-output name=short_sha::$calculatedSha"

      - name: Build and Push Docker image to ACR
        env:
          ACR_REGISTRY: ${{ vars.ACR_SERVER }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker build -f FormulaOne.Dockerfile -t $ACR_REGISTRY/formula-one-app:$IMAGE_TAG   -t $ACR_REGISTRY/formula-one-app:latest .
          docker push $ACR_REGISTRY/formula-one-app --all-tags

  deploy-container-to-ACS:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Deploy to ACR
        uses: azure/container-apps-deploy-action@v2        
        env:
          IMAGE_TAG: ${{ needs.build-and-deploy.outputs.short_sha }}
          ACR_SERVER: ${{ vars.ACR_SERVER }}
        with:
          registryUrl: ${{ vars.ACR_SERVER }}
          imageToDeploy: '${{ env.ACR_SERVER }}/formula-one-app:${{ env.IMAGE_TAG }}'
          # imageToDeploy: $ACR_SERVER/formula-one-app:$IMAGE_TAG
          targetPort: 8080
          ingress: external
          containerAppName: formula-one-system-dev-aca
          containerAppEnvironment: formula-one-system-dev-acae
          resourceGroup: formula-one-system-dev-rg
          environmentVariables: |
            ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://+:8080